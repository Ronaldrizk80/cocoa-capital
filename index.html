@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg: #F6F2E9;
  --paper: #FFFFFF;
  --ink: #1B1B1B;
  --ink-soft: #56524D;
  --ink-faint: #8C877F;
  --line: #E2DACA;
  --line-soft: #ECE5D5;
  --accent: #7A4A1F;
  --accent-soft: #A57850;
  --paid: #3B6B4F;
  --paid-bg: #E5EFE6;
  --due: #B86D2A;
  --due-bg: #F5E8D3;
  --overdue: #9B3F35;
  --overdue-bg: #F0DAD5;
  --draft: #56524D;
  --draft-bg: #ECE5D5;
}
.id-app { background: var(--bg); color: var(--ink); font-family: 'Geist', -apple-system, sans-serif; min-height: 100vh; }
.font-display { font-family: 'Fraunces', Georgia, serif; font-feature-settings: 'ss01'; letter-spacing: -0.015em; }
.font-num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.id-card { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; }
.id-divider { border-color: var(--line); }
.id-input {
  background: var(--paper); border: 1px solid var(--line); padding: 0.5rem 0.7rem;
  font-size: 0.85rem; color: var(--ink); border-radius: 2px; width: 100%;
  font-family: inherit; transition: border-color 0.15s ease;
}
.id-input:focus { outline: none; border-color: var(--accent); }
.id-input.id-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; text-align: right; }
.id-textarea { font-family: inherit; min-height: 80px; resize: vertical; }
.id-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); font-weight: 500; margin-bottom: 0.3rem; display: block; }
.id-btn { padding: 0.5rem 0.95rem; font-size: 0.83rem; font-weight: 500; border-radius: 2px; transition: all 0.12s ease; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; border: 1px solid transparent; }
.id-btn-primary { background: var(--ink); color: var(--bg); }
.id-btn-primary:hover { background: var(--accent); }
.id-btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.id-btn-ghost:hover { border-color: var(--ink); background: var(--paper); }
.id-btn-danger { background: transparent; color: var(--overdue); border-color: var(--overdue-bg); }
.id-btn-danger:hover { background: var(--overdue-bg); }
.id-tab { padding: 0.65rem 1rem; font-size: 0.85rem; color: var(--ink-soft); border-bottom: 2px solid transparent; transition: all 0.15s; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
.id-tab:hover { color: var(--ink); }
.id-tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.id-pill { font-size: 0.7rem; padding: 0.18rem 0.55rem; border-radius: 99px; font-weight: 500; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 0.3rem; }
.id-pill-paid { background: var(--paid-bg); color: var(--paid); }
.id-pill-due { background: var(--due-bg); color: var(--due); }
.id-pill-overdue { background: var(--overdue-bg); color: var(--overdue); }
.id-pill-draft { background: var(--draft-bg); color: var(--draft); }
.id-pill-sent { background: #DEE9F0; color: #2B5878; }
.id-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.id-table th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 500; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); background: var(--line-soft); }
.id-table td { padding: 0.75rem; border-bottom: 1px solid var(--line-soft); }
.id-table tr:last-child td { border-bottom: none; }
.id-table tr:hover td { background: var(--line-soft); }
.id-num-cell { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; text-align: right; }
.id-modal-overlay { position: fixed; inset: 0; background: rgba(20,18,15,0.55); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 2.5rem 1rem; overflow-y: auto; backdrop-filter: blur(2px); }
.id-modal { background: var(--paper); border-radius: 4px; max-width: 920px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
.id-kpi-tile { padding: 1.1rem 1.2rem; }
.id-kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); font-weight: 500; margin-bottom: 0.4rem; }
.id-kpi-value { font-family: 'Fraunces', serif; font-size: 1.65rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.id-kpi-sub { font-size: 0.75rem; color: var(--ink-faint); margin-top: 0.3rem; font-family: 'JetBrains Mono', monospace; }
.id-section-title { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; }
.id-section-eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 500; margin-bottom: 0.25rem; }
.id-grid-bg { background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px); background-size: 40px 40px; }

/* Invoice print styles */
.id-print-doc { background: white; color: #111; font-family: 'Geist', sans-serif; font-size: 11pt; line-height: 1.45; padding: 38px 44px; min-height: 1050px; }
.id-print-doc .iv-issuer { font-family: 'Fraunces', serif; font-size: 22pt; font-weight: 600; letter-spacing: -0.02em; }
.id-print-doc .iv-meta { font-size: 9.5pt; color: #444; }
.id-print-doc .iv-h { font-family: 'Fraunces', serif; font-size: 28pt; font-weight: 500; letter-spacing: -0.03em; color: #1B1B1B; }
.id-print-doc table.iv-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
.id-print-doc table.iv-table th { text-align: left; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.08em; color: #666; font-weight: 500; padding: 8px 6px; border-bottom: 1.5px solid #1B1B1B; }
.id-print-doc table.iv-table td { padding: 10px 6px; border-bottom: 1px solid #E5DFD0; font-size: 10.5pt; }
.id-print-doc .iv-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
.id-print-doc .iv-totals td { padding: 6px 6px; font-size: 10.5pt; }
.id-print-doc .iv-grand { border-top: 1.5px solid #1B1B1B; font-weight: 600; font-size: 12pt; }

@media print {
  .id-no-print { display: none !important; }
  .id-app { background: white !important; }
  body { background: white !important; }
  .id-print-doc { padding: 0; }
}

input[type="number"] { -moz-appearance: textfield; }
